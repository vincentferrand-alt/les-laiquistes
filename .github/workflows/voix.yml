# Génère les voix des personnages (dossier voices/) sur les serveurs de GitHub, sans rien installer chez toi.
# Se lance tout seul quand ce fichier est créé, quand une phrase change dans js/data.js,
# ou à la main : onglet Actions → « Générer les voix » → Run workflow.
name: Générer les voix
on:
  workflow_dispatch:
  push:
    branches: [main]   # seulement sur la branche publiée (sinon conflits entre branches)
    paths: ['js/data.js', 'tools/make-voices.py', '.github/workflows/voix.yml']
permissions:
  contents: write
jobs:
  voix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - run: python tools/make-voices.py
      - name: Enregistrer les voix dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add voices
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Voix générées automatiquement"
          git push
